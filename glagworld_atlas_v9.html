<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glagworld Atlas — Political, Development & Ethnic Map</title>
<style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#1f2328;--mut:#6b7280;--line:#ddd6c8;--sea:#cfe3ee;--land:#e6e1d4;--acc:#e08a00}
:root:not([data-theme=light]){}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1318;--panel:#171c23;--ink:#e8e6e1;--mut:#97a0ab;--line:#2a323d;--sea:#0d1a24;--land:#252b33}}
:root[data-theme=dark]{--bg:#0f1318;--panel:#171c23;--ink:#e8e6e1;--mut:#97a0ab;--line:#2a323d;--sea:#0d1a24;--land:#252b33}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:17px;margin:0;font-weight:700}h1 small{font-weight:400;color:var(--mut);margin-left:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:6px 12px;cursor:pointer;font:inherit}
.seg button.on{background:var(--acc);color:#111;font-weight:600}
input[type=search]{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;min-width:160px}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
main{flex:1;display:flex;min-height:0}
#mapwrap{flex:1;position:relative;background:var(--sea);min-width:0}
svg{width:100%;height:100%;display:block;cursor:grab}svg:active{cursor:grabbing}
.c{stroke:var(--bg);stroke-width:.4;vector-effect:non-scaling-stroke;transition:fill .25s,opacity .2s}
.c.un{fill:var(--land)}.c.hit{cursor:pointer}
.c.dim{opacity:.35}
.outline{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none}
.sel{fill:none;stroke:#fff;stroke-width:3;vector-effect:non-scaling-stroke;pointer-events:none;filter:drop-shadow(0 0 3px #000)}
.rel{fill:none;stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-dasharray:5 4;pointer-events:none}
.mk{cursor:pointer;stroke-width:2}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px #0004;display:none;max-width:230px}
#legend{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-height:46%;overflow:auto;font-size:12px;opacity:.97}
#legend .it{display:flex;align-items:center;gap:6px;padding:1px 3px;border-radius:5px;cursor:pointer}
#legend .it:hover,#legend .it.on{background:var(--line)}
.gbar{height:12px;width:210px;border-radius:4px;border:1px solid #0003;margin:4px 0 2px}.gtk{position:relative;height:14px;width:210px;font-size:10px;color:var(--mut)}.gtk span{position:absolute;transform:translateX(-50%)}
.gcard{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:10px 0 2px}.gcard .big{font-size:22px;font-weight:700;line-height:1.1}.gcard .gb{height:6px;border-radius:3px;background:var(--line);margin:3px 0 6px;overflow:hidden}.gcard .gb i{display:block;height:100%}
.sw{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid #0003}
#zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
aside{width:340px;max-width:42vw;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px}
aside h2{margin:0 0 2px;font-size:20px}.badge{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0}dt{color:var(--mut)}dd{margin:0}
.bar{display:flex;height:18px;border-radius:6px;overflow:hidden;margin:6px 0;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:6px;font-size:13px}.row b{margin-left:auto;font-variant-numeric:tabular-nums}
.chip{display:inline-block;margin:2px 3px 2px 0;padding:2px 9px;border-radius:99px;border:1px solid var(--line);cursor:pointer;font-size:12px}
.chip.a{border-color:#2f9e44}.chip.e{border-color:#e03131}.chip.f{opacity:.7;border-style:dashed}
.grat{fill:none;stroke:#fff;stroke-opacity:.13;stroke-width:.5;vector-effect:non-scaling-stroke;pointer-events:none}.shade{pointer-events:none}
#mapwrap.gl{background:#070b11}.gl .sph{stroke:#8ec5e8;stroke-opacity:.55;stroke-width:1.5;vector-effect:non-scaling-stroke}
.flagl{pointer-events:none;transition:opacity .25s}
.bio-head{display:flex;align-items:center;gap:12px}
.bio-flag{height:60px;width:auto;max-width:112px;object-fit:contain;flex:none;border:1px solid var(--line);border-radius:5px;box-shadow:0 2px 6px #0003}
.note{color:var(--mut);font-size:12px}h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 0 4px}
@media(max-width:820px){main{flex-direction:column}aside{width:100%;max-width:none;height:42%;border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<header><h1>Glagworld Atlas<small>Glagglepedia nations on Glagworld</small></h1>
<div class="seg" id="modes"><button data-m="political" class="on">Political</button><button data-m="gdi">Development</button><button data-m="ethnic">Ethnic</button><button data-m="terrain">Terrain</button></div>
<div class="seg" id="views"><button data-v="flat" class="on">Flat</button><button data-v="globe">Globe</button></div>
<button class="btn" id="spin" style="display:none" title="Slowly rotate the globe">Auto-rotate: off</button>
<input type="search" id="q" placeholder="Search nation or species…" list="dl"><datalist id="dl"></datalist>
<button class="btn" id="rel" title="Draw allies (green) and enemies (red) of the selected nation">Relations: on</button>
<button class="btn" id="theme">Theme</button></header>
<main><div id="mapwrap"><svg id="svg"></svg><div id="tip"></div><div id="legend"></div>
<div id="zoom"><button class="btn" id="zi">+</button><button class="btn" id="zo">−</button><button class="btn" id="zr">⌂</button></div></div>
<aside id="side"></aside></main>

s a collab, WIP.", "continent": "Glagus", "borders": ["doublyso", "gazoland", "glaggleland"]}, {"id": "thisselland", "name": "Thisselland", "color": "#c7a908", "regions": [], "status": "semi-canon", "theme": "Amusement attractions & natural resources", "pop": 7.5, "capital": "Honbler Town", "demonym": "Thissel", "eth": [["giggler", 80], ["other", 20]], "basis": "Pop. 7.5M stated. Gigglers 'dominate'; remainder estimated (includes the indigenous Thisselags).", "allies": ["glaggleland", "gazoland"], "enemies": ["enphosius"], "lore": "Republic founded 1500 (leader Gladirus Fanikan; currency the glastep). Gold found at Glag Town in 1504 sparked a boom; renamed Honbler Town in 1687. Largest city Kringules (metals, munitions). Fought in the Glag War (1910-14). Formerly part of Glaggleland; its army was infected by Enphosian goo the night before the 1998 Massacre and it broke away to rebuild (3M dead). Now a neutral resource supplier to both Glaggleland and Gazoland, and sent volunteers after the Fog (2021). Wiki notes: 'very west' of Glagworld with a hot steppe climate.", "continent": "Glagus", "borders": ["glaggleland"]}, {"id": "gleeberland", "name": "Gleeberland", "color": "#bd4cff", "regions": [], "status": "canon", "theme": "Skatepark", "pop": 56, "capital": "n/a", "demonym": "Gleeberlander", "eth": [["gleeber", 70], ["guuber", 8], ["gazo", 6], ["gloober", 6], ["glaaber", 4], ["other", 6], ["dizgi", 0.000714]], "basis": "Estimated from the inhabitant list (Gleebers, Grigs, Guubers, Gazos, Gloobers, Glaabers). Most of the world's ~600 Dizgis live here (Dizgi page; ~400 is an estimated split), far too few to show.", "allies": ["gazoland", "glooberland", "guuberlandia", "kworozite"], "enemies": ["enphosius"], "lore": "Skate-culture country on the continent of Bibergly, discovered by Glooberland sailors; no professional army, with militias working for Guuberlandia.", "continent": "Bibergly", "claimColor": "#de99ff", "borders": ["gemboland", "glooberland", "guuberlandia"], "mapnote": "The lighter purple areas in Bibergly are loose border claims; the stronger purple marks the settled coast.", "abs": {"dizgi": 400}, "terr": "Bibergly 95% (46% loose claims) \u00b7 Glagus 5%"}, {"id": "grandnovasia", "name": "Grand Novasia", "color": "#567f00", "regions": [], "status": "canon", "theme": "Ruined wasteland nation", "pop": 0.001, "capital": "n/a", "demonym": "Novasian (former)", "eth": [["other", 100]], "basis": "The wiki lists only 'The Shape' as inhabitant; population is quoted as one thousand (the Laqua Empire). No other species are given.", "allies": [], "enemies": [], "lore": "A ruined country, once ruled from the Novasian metropolis, now a moon-like wasteland after civil wars and Enphosian meddling. Borders Glaaberland and Gemboland. Founded by Glaaber settlers in 1755. The wiki also calls it a 'continent' in places; this atlas treats Grand Novasia as a country, with Southern Novasia and the Northeastern Wastelands as separate areas.", "fa": ["glaaberland"], "fe": ["gemboland"], "continent": "Baiwo", "borders": ["gemboland", "glaaberland", "northeasternwastelands", "southernnovasia"], "mapnote": "Only the dark green area is Grand Novasia. Its western end reaches into Calanica. Southern Novasia (grey) and the Northeastern Wastelands are separate entries.", "terr": "Baiwo 53% \u00b7 Calanica 47%"}, {"id": "southernnovasia", "name": "Southern Novasia", "color": "#c0c0c0", "regions": [], "status": "canon", "theme": "Unclaimed southern territory", "pop": null, "capital": "None listed", "demonym": "None listed", "eth": [["other", 100]], "basis": "The wiki gives no population or inhabitants for this area.", "allies": [], "enemies": [], "lore": "The southern part of the Grand Novasian landmass, shown divided into many regions on the wiki map. The wiki's Unphosia, Kworozite and Laqua pages place their borders on 'Southern Grand Novasia', and the Laqua Empire lies inside it. This atlas does not treat it as legally owned by Grand Novasia: the grey on the wiki map is read as territory Grand Novasia has no legitimate claim to, which differs from the Northeastern Wastelands, which Grand Novasia could not physically hold.", "mapnote": "Drawn as a separate area from Grand Novasia proper (dark green). The Northeastern Wastelands are also separate.", "borders": ["grandnovasia", "kworozite", "laqua", "northeasternwastelands", "unphosia"]}, {"id": "kworozite", "name": "Kworozite Empire", "color": "#54007e", "regions": [], "status": "semi-canon", "theme": "Sports-obsessed dynastic empire", "pop": 194.42, "capital": "n/a", "demonym": "Kworozite", "eth": [["gleeber", 60], ["gloober", 22], ["glaaber", 17], ["bamella", 1]], "basis": "Pop. 194.42M stated; species listed (Gleebers, Gloobers, Glaabers, Bamellas) but shares estimated. Bamellas capped at ~1%: the Bamella page gives only ~1.7M in their native region (northern Baiwo) and <100k abroad.", "allies": ["gemboland", "gazoland", "gleeberland", "laqua"], "enemies": ["enphosius"], "lore": "Empire in southern Baiwo ruled by the Kworoz dynasty (Emperor Shlungolius Kwaloazo). Borders the southern Grand Novasian states (north). Native Bamellas were joined by Gleeber settlers from Glooberland from the 2nd c. BG; the Battles of Peace and Harmony (148-114 BG) began dynastic rule. Sport is the most popular pastime as all other entertainment is state-controlled, and citizens rank each other 1-10 for loyalty.", "continent": "Baiwo", "borders": ["southernnovasia"], "mapnote": "The islands the wiki map colours as 'Pasaki' (a non-canon entry) are treated as part of the Kworozite Empire."}, {"id": "blabornie", "name": "Blabornie", "color": "#6c5c0b", "regions": [], "status": "semi-canon", "theme": "Ports & military bases / tourism & corporations", "pop": 31.95, "capital": "Blabeeville-Lehabippa", "demonym": "Blaborn / Blabann / Blavicar", "eth": [["giggler", 67.2], ["gazo", 20.0], ["gembo", 8.8], ["gloober", 3.5], ["gleeber", 0.5]], "basis": "Calculated from the wiki's province table (population-weighted over its 8 provinces; Eqallitanna's shares add up to 110% on the wiki and were scaled). Pop. 31.95M is the infobox figure.", "allies": ["corzon", "varpoonia"], "enemies": ["enphosius", "gazoland", "doublyso"], "lore": "Constitutional republic (heir to the Blaborn Empire) on the southernmost point of Glagus: an advanced, trade-hub nation with big ports and a large military. Borders Corzon, Doublyso, Glooberland, Varpoonia and Gleeberland. Fought the Glaggols in the Maritime Wars, was conquered by the Gembo Empire, and later suffered slave wars, a civil war and Communist rule under the Fezvinot Worker's Union of Glagus. Elections since 2002 (Technologists, Corists, Ecologists). 8th member of the Gigglic Community. Content warning on source page: slavery, terrorism, murder, genocide.", "continent": "Glagus", "borders": ["corzon", "doublyso", "varpoonia"], "mapnote": "The infobox lists Glooberland and Gleeberland as neighbours; on the wiki map both lie across open sea."}, {"id": "frowntown", "name": "Frowntown", "color": "#d9480f", "regions": [], "status": "canon", "theme": "Depression zone megapolis", "pop": 0.9475, "capital": "Frowntown", "demonym": "Sad-Glag", "eth": [["sobber", 40], ["whimperer", 15], ["weeper", 15], ["gloomber", 15], ["unfestive", 12], ["other", 3]], "basis": "Estimated from the inhabitant list.", "allies": [], "enemies": [], "lore": "De facto independent mountain city of Sobbers and other sad glaggles. Lost ~80% of its people in the Bombing of 2010. Placed in the Scottish Highlands (north-west of Glaggleland).", "continent": "Glagus", "borders": ["glaggleland"], "mapnote": "Drawn as the north-western enclave inside Glaggleland on the wiki map. Other enclaves on that map are non-canon and are ignored."}, {"id": "qwerty", "name": "Qwerty Islands", "color": "#b4a24a", "regions": [], "status": "semi-canon", "theme": "Island resort", "pop": 7.5, "capital": "Qwallter", "demonym": "Qwertian", "eth": [["gazo", 60], ["giggler", 28], ["other", 12]], "basis": "Estimated from history: by 1937 the population was 15,000, of whom 9,000 were Gazos (60%); the rest were other Glaggles (Lemonade Gigglers live here) and other creatures. No later breakdown is given.", "allies": [], "enemies": ["gazoland"], "lore": "Five volcanic islands colonised by Gazoland in 1870. Government: Kruglizm.", "continent": "Glagus", "borders": []}, {"id": "laqua", "name": "Laqua Empire", "color": "#ff81ff", "regions": [], "status": "canon", "theme": "Microstate / pariah empire", "pop": 0.001, "capital": "Laquaville", "demonym": "Laquian", "eth": [["gembo", 40], ["giggler", 35], ["gloober", 25]], "basis": "Estimated from the inhabitant list.", "allies": ["gemboland", "glaggleland", "glooberland"], "enemies": ["gazoland"], "lore": "Exiled god-emperor Laqua Dane's black-painted microstate in southern Grand Novasia.", "continent": "Baiwo", "borders": ["southernnovasia"]}, {"id": "unphosia", "name": "Unphosia", "color": "#96c19c", "regions": [], "status": "canon", "theme": "Metropolis city-state", "pop": 5, "capital": "Unphosia", "demonym": "Unphotic", "eth": [["unphosian", 88], ["glaaber", 3], ["sobber", 3], ["other", 6]], "basis": "Estimated from 'inhabited almost entirely by Unphosians', with Bonamimics, sad-glags, Unphotic Glaabers and rarely Gazos and Gleebers (Other).", "allies": ["glaggleland", "gemboland", "glooberland", "gleeberland", "gazoland"], "enemies": ["enphosius"], "lore": "Clean, high-tech safe haven on southern Baiwo's coast, just below Southern Grand Novasia, strongly anti-Enphoso.", "continent": "Baiwo", "borders": ["southernnovasia"]}, {"id": "guuberlandia", "name": "Guuberlandia", "color": "#ff00aa", "regions": [], "status": "canon", "theme": "Art gallery", "pop": 0.7, "capital": "Colortown", "demonym": "Guuber", "eth": [["guuber", 85], ["gleeber", 15]], "basis": "Estimated from the inhabitant list.", "allies": ["gleeberland"], "enemies": ["enphosius"], "lore": "Hidden forest country of artists, with a militia instead of an army.", "continent": "Bibergly", "borders": ["gleeberland"]}, {"id": "corzon", "name": "Corzon", "color": "#e26018", "regions": [], "status": "semi-canon", "theme": "Socialist republic (Marxist-Leninist)", "pop": 9.3, "capital": "New Corzon", "demonym": "Corzonian", "eth": [["gazo", 45], ["giggler", 45], ["other", 10]], "basis": "Estimated: the page gives no breakdown, but its early history names a Confederation of Gazo and Doublysioners (Giggler stock) on this territory.", "allies": ["gazoland", "doublyso", "varpoonia", "blabornie"], "enemies": [], "lore": "Landlocked socialist republic in central-southern Glagus, run by the Council of Deputies and Workers, Peasants of Corzon under General Secretary Michal Gleedrobin. A major agricultural trader, selling crops and water to its neighbours, with good relations with Gazoland, Doublyso, Varpoonia and Blabornie. Formed in 671 AG as a kingdom out of the Duchy of Rozcia's conquests (the page also lists a dissolution date of 1912 AGGB). Largest city: Minsusk.", "continent": "Glagus", "borders": ["blabornie", "doublyso", "gazoland", "varpoonia"]}, {"id": "varpoonia", "name": "Varpoonia", "color": "#d9cc91", "regions": [], "status": "semi-canon", "theme": "Fishing", "pop": 5.5, "capital": "Faryang", "demonym": "Varpic", "eth": [["giggler", 60], ["gazo", 25], ["gembo", 15]], "basis": "Estimated: the infobox lists Glaggles (Gigglers), Gazos and Gembos as inhabitants and the history calls the region Giggler-majority.", "allies": ["tunglornius"], "enemies": ["enphosius"], "lore": "'Ready your rods!' A fishing nation of shanty towns and seafood restaurants (such as the Davey Jones' Locker), once a hotbed of piracy. Part of the Blaborn Empire, then the Glaggol Empire; conquered by Gazoland in the 18th century and independent again after the Great War in 1913. Sometimes called 'the modern Blaborn Empire', a title it dislikes, and home to the most lakes on Glagus.", "continent": "Glagus", "borders": ["blabornie", "corzon", "gazoland"]}, {"id": "northeasternwastelands", "name": "Northeastern Wastelands", "color": "#acb086", "regions": [], "status": "canon", "theme": "Wasteland", "pop": null, "capital": "None listed", "demonym": "None listed", "eth": [["other", 100]], "basis": "No population or inhabitants are given on the wiki.", "allies": [], "enemies": [], "lore": "A ruined wasteland region. The wiki's Grand Novasia page lists it, together with Baiwo and the Laqua Empire, among the places housed by that wasteland; it has no page of its own. It is not a country, but is shown for completeness and, as on the wiki map, divided into many regions.", "continent": "Baiwo", "borders": ["grandnovasia", "southernnovasia"], "mapnote": "Not a country: listed on the wiki as part of Grand Novasia's wasteland.", "terr": "Baiwo 95% \u00b7 Calanica 5%"}], "markers": [{"id": "enphosius", "name": "Enphosius", "color": "#7a0019", "regions": [], "status": "semi-canon", "theme": "Pocket-dimension hell realm of Enphoso", "pop": null, "capital": "Enphosian Pyramidian", "demonym": "Enphosian", "eth": [["enphosian", 55], ["other", 45]], "basis": "No figures given; estimated from inhabitants (Enphoso, Enfosi, Enphosians, Mimics, Risios) plus enslaved glaggles.", "allies": [], "enemies": ["glaggleland", "gemboland", "glaaberland", "glooberland", "gazoland", "gizmoland", "gleeberland", "handofmann", "weirdose", "altablibbly", "unphosia", "guuberlandia", "squiggarth", "thisselland", "kworozite", "blabornie", "varpoonia"], "lore": "Pocket dimension deep in the planet's core, home of Enphoso and the Enphosian Pyramidian, where captured glaggles are enslaved and tortured. Source of the 1998 Glaggleland Massacre (planned for 96 years) and the Enphosian Fog. It has no location on the map. Page is semi-canon and slated for overhaul."}], "continents": [{"id": "glagus", "name": "Glagus", "color": "#ffd400", "note": "Holds the Glaggleland mainland, Gazoland, Squiggarth, Doublyso, Blabornie and the western island nations. It meets Calanica across the Gnosedendy Channel (Tunglornius page).", "share": 0.1635, "nations": [["gazoland", 0.3889], ["glaggleland", 0.1254], ["doublyso", 0.1028], ["varpoonia", 0.0861], ["corzon", 0.0859], ["blabornie", 0.0742], ["squiggarth", 0.043], ["thisselland", 0.0231], ["weirdose", 0.021], ["altablibbly", 0.0203], ["gleeberland", 0.0131], ["handofmann", 0.0108]], "unclaimed": 0.0}, {"id": "calanica", "name": "Calanica", "color": "#ff6f40", "note": "Holds Gemboland, Glooberland, Gizmoland, Glaaberland and Tunglornius. The western end of Grand Novasia reaches into it.", "share": 0.3044, "nations": [["glooberland", 0.3313], ["gemboland", 0.3253], ["glaaberland", 0.1226], ["grandnovasia", 0.1217], ["tunglornius", 0.0707], ["gizmoland", 0.0155], ["northeasternwastelands", 0.0127]], "unclaimed": 0.0}, {"id": "bibergly", "name": "Bibergly", "color": "#bd4cff", "note": "Home of Gleeberland and Guuberlandia. Most of it is only loosely claimed (the lighter areas on the political map).", "share": 0.1346, "nations": [["gleeberland", 0.3181], ["glooberland", 0.2763], ["gemboland", 0.2116], ["glaggleland", 0.1896]], "unclaimed": 0.0}, {"id": "baiwo", "name": "Baiwo", "color": "#54007e", "note": "Holds the Kworozite Empire, Unphosia, Southern Novasia, the Northeastern Wastelands, the Laqua Empire and most of Grand Novasia.", "share": 0.3973, "nations": [["southernnovasia", 0.4732], ["northeasternwastelands", 0.2041], ["kworozite", 0.1785], ["grandnovasia", 0.1043], ["glaggleland", 0.0342], ["unphosia", 0.0051]], "unclaimed": 0.0}, {"id": "towo", "name": "Towo", "color": "#2a3158", "note": "No nation lies on Towo.", "share": 0.0002, "nations": [], "unclaimed": 0.0}]}

   +'<div class="it" style="cursor:default"><span class="sw" style="background:var(--land)"></span>Not scored</div><div class="note" style="margin-top:4px">Geometric mean of health, knowledge<br>and living standard (lore-based estimates)</div>';return}
 const used=DATA.species.filter(s=>NA.some(n=>pct(n,s.id)>0));
 L.innerHTML=(spSel?`<div class="it" data-s=""><b>✕ Clear species filter</b></div>`:'<div class="note">Click a species to chart its spread'+(mode!=='political'?'<br>Diagonal stripes = mixed peoples<br>(band width ∝ population share)':'')+'</div>')+used.map(s=>`<div class="it ${spSel===s.id?'on':''}" data-s="${s.id}"><span class="sw" style="background:${s.color}"></span>${s.name}</div>`).join('');
 L.querySelectorAll('.it').forEach(i=>i.onclick=()=>{spSel=i.dataset.s&&spSel!==i.dataset.s?i.dataset.s:null;paint()})}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;spSel=null;if(mode!=='terrain')selC=null;tip.style.display='none';document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('on',x===b));paint();draw()});
document.getElementById('dl').innerHTML=[...NA.map(n=>n.name),...DATA.continents.map(c=>c.name),...DATA.species.map(s=>s.name)].map(v=>`<option value="${v}">`).join('');
q.onchange=()=>{const v=q.value.toLowerCase();const n=NA.find(x=>x.name.toLowerCase()===v);if(n){pick(n,true)}else{const c=DATA.continents.find(x=>x.name.toLowerCase()===v);if(c){document.querySelector('#modes [data-m=terrain]').click();pickCont(c,true)}else{const s=DATA.species.find(x=>x.name.toLowerCase()===v);if(s){if(mode!=='ethnic'&&mode!=='political')document.querySelector('#modes [data-m=ethnic]').click();spSel=s.id;paint()}}}};
rel.onclick=()=>{showRel=!showRel;rel.textContent='Relations: '+(showRel?'on':'off');rels()};
theme.onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue('--bg').trim()==='#0f1318';d.dataset.theme=dark?'light':'dark';paint()};
zi.onclick=()=>view==='globe'?tweenGlobe(orth.rotate(),clampK(gk*1.6),300):svg.transition().call(zoom.scaleBy,1.6);zo.onclick=()=>view==='globe'?tweenGlobe(orth.rotate(),clampK(gk/1.6),300):svg.transition().call(zoom.scaleBy,1/1.6);
zr.onclick=()=>{sel=null;selC=null;rels();side.innerHTML=home();if(view==='globe')tweenGlobe(HOME,1,700);else svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity)};
function home(){return `<h2>Glagworld Atlas</h2><p class="note">Click any coloured country, or a point marker, to open its dossier. Switch between <b>Political</b>, <b>Development</b> (GDI, dark blue = high, dark red = low), <b>Ethnic</b> and <b>Terrain</b> (continents) views above, or pick a species in the legend to chart its share across the map.</p>
<h3>Nations (${DATA.nations.length+DATA.markers.length})</h3>`+NA.map(n=>`<span class="chip" data-go="${n.id}" style="border-color:${n.color}">${n.name}</span>`).join('')+`<p class="note">The map is the Glagglepedia world map, georeferenced by fitting the globe image on the Gazoland wiki page (the image covers about 339° of longitude and 136° of latitude, so the poles are empty), so it can be shown flat or on a spinnable globe. Lighter areas in Bibergly are loose border claims. The islands the wiki map labels Pasaki and Gliiberland (non-canon) are counted as Kworozite and Glooberland, and non-canon enclaves are ignored. Southern Novasia (grey) is shown as its own area, not as legal Grand Novasian territory. Enphosius is a pocket dimension with no place on the map. Species shares are exact where the wiki gives numbers, otherwise estimated.</p>`}
side.innerHTML=home();side.addEventListener('click',e=>{const c=e.target.closest('[data-go]');if(c)pick(NID[c.dataset.go],true)});
addEventListener('resize',()=>{fit();draw()});

/* ---- globe mode ---- */
const clampK=k=>Math.max(.8,Math.min(14,k));
let raf=0;const sched=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})};
function tweenGlobe(r1,k1,ms=900){const r0=orth.rotate(),dl=((((r1[0]-r0[0])%360)+540)%360)-180,ir=d3.interpolate(r0,[r0[0]+dl,r1[1]]),ik=d3.interpolate(gk,k1);
 svg.transition('globe').duration(ms).tween('globe',()=>t=>{orth.rotate(ir(t));gk=ik(t);orth.scale(gR0*gk);draw()})}
function flyGlobe(n){if(!mapped(n))return;stopSpin();const c=cen(n);let ext=3;
 if(n.regions&&n.regions.length){const bb=d3.geoBounds(n.main);let w=bb[1][0]-bb[0][0];if(w<0)w+=360;ext=Math.max(w,bb[1][1]-bb[0][1])}
 tweenGlobe([-c[0],Math.max(-90,Math.min(90,-c[1]))],Math.max(1,Math.min(6,100/Math.max(ext,12))))}
const dragG=d3.drag().clickDistance(4).on('start',()=>{stopSpin();svg.interrupt('globe')}).on('drag',e=>{const s=.28/gk,r=orth.rotate();orth.rotate([r[0]+e.dx*s,Math.max(-90,Math.min(90,r[1]-e.dy*s))]);sched()});
const wheelG=e=>{e.preventDefault();svg.interrupt('globe');gk=clampK(gk*Math.exp(-e.deltaY*.0018));orth.scale(gR0*gk);sched()};
let spinT=null;const spinBtn=document.getElementById('spin');
function stopSpin(){if(spinT){spinT.stop();spinT=null}spinBtn.textContent='Auto-rotate: off'}
function startSpin(){stopSpin();let last=0;spinBtn.textContent='Auto-rotate: on';spinT=d3.timer(t=>{const dt=t-last;last=t;const r=orth.rotate();orth.rotate([r[0]+dt*.012,r[1]]);draw()})}
spinBtn.onclick=()=>spinT?stopSpin():(svg.interrupt('globe'),startSpin());
function setView(v){if(v===view)return;
 document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 wrap.classList.toggle('gl',v==='globe');spinBtn.style.display=v==='globe'?'':'none';tip.style.display='none';
 if(v==='globe'){svg.interrupt();svg.call(zoom.transform,d3.zoomIdentity);svg.on('.zoom',null);view='globe';proj=orth;path.projection(orth);
  svg.call(dragG);svg.node().addEventListener('wheel',wheelG,{passive:false});mk.attr('r',6).style('stroke-width',2);
  if(sel&&mapped(sel)){const c=cen(sel);orth.rotate([-c[0],Math.max(-90,Math.min(90,-c[1]))])}}
 else{stopSpin();svg.interrupt('globe');svg.on('.drag',null);svg.node().removeEventListener('wheel',wheelG);view='flat';proj=flat;path.projection(flat);
  svg.call(zoom);svg.call(zoom.transform,d3.zoomIdentity)}
 fit();paint();draw()}
document.querySelectorAll('#views button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
fit();draw();paint();
</script></body></html>
